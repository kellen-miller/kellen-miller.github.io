name: Site
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-paths:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@75c70f9d5db7117810669e0af01fd2eafdc396c6
        with:
          filters: |-
            {
              "site": [
                "src/**",
                "public/**",
                "tests/**",
                "package.json",
                "package-lock.json",
                "*.config.*",
                "tsconfig*.json",
                ".node-version",
                ".nvmrc",
                ".npmrc",
                ".github/workflows/**"
              ]
            }
  static-analysis:
    name: Node.js
    uses: kellen-miller/ci/.github/workflows/node-lint.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      check-name: Formatting, type and static analysis
      format-script: format:check
  browser-tests:
    name: Node.js
    uses: kellen-miller/ci/.github/workflows/node-test.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      check-name: Build and browser end-to-end tests
      test-script: test:ci
      install-playwright: true
      playwright-browsers: chromium
      artifact-name: playwright-report
      artifact-retention-days: 7
      artifact-path: |
        playwright-report/
        test-results/
    needs: site-paths
    if: ${{ !cancelled() && (needs.site-paths.result != 'success' || fromJSON(needs.site-paths.outputs.changes).site) }}
