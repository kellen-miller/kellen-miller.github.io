name: Code duplication
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: code-duplication-CI-${{ github.ref }}
  cancel-in-progress: true
jobs:
  duplication-analysis:
    name: Code duplication / Source analysis
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@eb1a4f5900aaa6468cffb67513da61078265ba26
