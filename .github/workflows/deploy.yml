name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.config.*'
      - 'tsconfig*.json'
      - '.node-version'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-site:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main'
    uses: kellen-miller/ci/.github/workflows/deploy-github-pages.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      output-directory: dist
